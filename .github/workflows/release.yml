name: Release

# One-click package release: pick a package + version bump in the Actions UI
# ("Run workflow"), and this verifies it against the exact gate CI already
# runs, bumps the version, tags it, pushes both back to main, and publishes
# to npm. No local `npm publish` from anyone's machine required.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - checkout-core
          - pay-sdk
          - x402
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release @thru-payment/${{ inputs.package }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Same gate CI runs on every push — never publish something CI hasn't
      # already proven builds, typechecks, and (for x402) passes its tests
      # and smoke-tests the built artifact.
      - name: Verify package
        run: npm run "${{ inputs.package }}:verify"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        working-directory: packages/${{ inputs.package }}
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Commit + tag
        run: |
          git add "packages/${{ inputs.package }}/package.json"
          git commit -m "chore(release): ${{ steps.bump.outputs.name }}@${{ steps.bump.outputs.version }}"
          git tag "${{ inputs.package }}-v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "${{ inputs.package }}-v${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        working-directory: packages/${{ inputs.package }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
