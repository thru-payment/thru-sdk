name: Release

# One-click package release: pick a package + version bump in the Actions UI
# ("Run workflow"), and this verifies it against the exact gate CI already
# runs, bumps the version, tags it, pushes both back to main, and publishes
# to npm. No local `npm publish` from anyone's machine required.

on:
  workflow_dispatch:
    inputs:
      package:
        # Free text rather than a dropdown, deliberately. A `choice` list has to be hand-edited
        # every time a package is added, and the failure mode is silent: the new package simply
        # cannot be released until someone remembers to come back here. The validation step below
        # checks the name against the real workspaces and prints the valid set on a typo, which
        # gives the same protection without the upkeep.
        description: 'Package directory under packages/ (e.g. x402)'
        required: true
        type: string
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release @thru-payment/${{ inputs.package }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Fail here, before anything is bumped, tagged or published, rather than partway through on a
      # confusing "missing script" error. Also catches a package that exists but has no verify
      # script, which would otherwise publish something no gate ever ran against.
      - name: Validate package name
        run: |
          PKG="${{ inputs.package }}"
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error::No package at packages/$PKG. Available:"
            ls packages | sed 's/^/  - /'
            exit 1
          fi
          if ! node -e "process.exit(require('./packages/$PKG/package.json').scripts?.verify ? 0 : 1)"; then
            echo "::error::packages/$PKG has no \"verify\" script, so there is no gate to publish behind."
            exit 1
          fi

      # Build every workspace first, in dependency order. pay-sdk typechecks against
      # checkout-core's emitted dist, so verifying it against an unbuilt dependency fails for a
      # reason that has nothing to do with the release. Build order lives in the root script and
      # nowhere else, so adding a package means editing one line rather than every workflow.
      - name: Build all packages
        run: npm run build

      # The same gate CI runs on every push — never publish something CI has not already proven
      # builds, typechecks, tests and smoke-tests. Resolved from the package's own name so a new
      # package does not also need a hand-written <pkg>:verify alias at the root.
      - name: Verify package
        run: npm --workspace "$(node -p "require('./packages/${{ inputs.package }}/package.json').name")" run verify

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        working-directory: packages/${{ inputs.package }}
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Commit + tag
        run: |
          git add "packages/${{ inputs.package }}/package.json"
          git commit -m "chore(release): ${{ steps.bump.outputs.name }}@${{ steps.bump.outputs.version }}"
          git tag "${{ inputs.package }}-v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "${{ inputs.package }}-v${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        working-directory: packages/${{ inputs.package }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
