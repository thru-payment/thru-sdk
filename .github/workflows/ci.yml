name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · test · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Every step below is workspace-wide and `--if-present`, so A NEW PACKAGE IS PICKED UP BY CI
      # WITHOUT EDITING THIS FILE. The previous version named each package by hand, which meant a
      # package added without also editing here was silently never built, typechecked or tested.
      #
      # Build is the one exception: it calls the root script because order matters (pay-sdk
      # typechecks against checkout-core's emitted dist) and npm does NOT topologically sort
      # `--workspaces` runs. Dependency order therefore lives in the root build script alone.
      - name: Build all packages (dependency order)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      # Unit tests compile from `src/` through ts-jest and will pass against a `dist/` no consumer
      # can import — that exact gap once shipped a build throwing ERR_MODULE_NOT_FOUND under Node's
      # ESM resolver with 28 tests green. Relatedly, tsc alone (no bundler) will silently emit
      # extensionless relative imports under the wrong moduleResolution, producing a dist/ that
      # only loads inside a bundler; checkout-core hit that one. So these steps check what
      # merchants actually receive: `smoke` loads the built artifact under Node's own resolver and
      # walks every exports subpath, and the examples fixture typechecks the canonical integration
      # against the published types.
      - name: Smoke-test built artifacts
        run: npm run smoke --workspaces --if-present

      - name: Typecheck canonical examples
        run: npm run typecheck:examples --workspaces --if-present
